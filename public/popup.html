<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><link rel="stylesheet" href="style.css"><title>本機直播翻譯</title><body class="popup"><h1>本機直播翻譯</h1><p>聲音與字幕只在這台電腦處理</p><div class="actions"><button id="prepare">① 載入／暖機模型</button><button id="start" disabled>② 翻譯目前直播</button><button id="stop">停止翻譯（保留模型）</button><button id="release">釋放模型（取消暖機）</button><button id="options">詞彙表與設定</button></div><details><summary>YouTube 快速控制</summary><form id="youtubeQuick"><label>播放模式<select id="quickMode"><option value="live">即時播放</option><option value="delayed">延後同步</option></select></label><label>延後秒數<input id="quickDelay" type="number" min="2" max="10" step="0.5"></label><label>聊天室翻譯<select id="quickChat"><option value="false">關閉</option><option value="true">開啟</option></select></label><button type="submit">套用控制（保留模型）</button></form></details><p id="status" role="status">讀取狀態…</p><p id="metrics"></p><small>首次需下載模型。先暖機，再開啟直播並按②。辨識目標為句尾後 1 秒，翻譯耗時另計。</small><script type="module" src="popup.js"></script></body></html>
